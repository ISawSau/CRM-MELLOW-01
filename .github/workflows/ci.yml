# Tests en cada pull request y en cada push a main; instaladores de Windows y
# Linux (Arch) y el APK de Android (D-101) en cada push a main o al lanzarlo a mano desde
# la pestaña Actions.
# Al subir la versión, los instaladores se publican en Releases (D-100). En Actions se
# guardan solo un día y sin bloquear nada: el almacenamiento gratuito de artefactos es
# pequeño y cada ejecución genera unos 400 MB.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  calidad:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: |
          npm ci
          node node_modules/electron/install.js
          node scripts/descargar-ffmpeg.mjs

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Formato
        run: npx prettier --check .

      - name: Tests unitarios
        run: npm test

      # Ubuntu 24.04 restringe los user namespaces con AppArmor, y el sandbox de
      # Chromium los necesita. Se permiten en el runner en lugar de usar --no-sandbox,
      # para que los tests comprueben la app con el sandbox activado.
      - name: Permitir el sandbox de Chromium en el runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Tests de interfaz (Playwright + Electron)
        run: xvfb-run -a npm run test:e2e

      - name: Tests de la interfaz móvil (Chromium con pantalla de móvil)
        run: |
          npx playwright install chromium
          npm run test:e2e:movil

      - name: Informe de Playwright
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 2

  # Al subir la versión en main: crea la versión en Releases como borrador, para que cada
  # instalador se suba a ella directamente (sin pasar por el almacenamiento de artefactos).
  version:
    name: Preparar versión
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      nueva: ${{ steps.v.outputs.nueva }}
    steps:
      - uses: actions/checkout@v6

      - name: Comprobar la versión y crear el borrador
        id: v
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          draft="$(gh release view "v$v" --json isDraft -q .isDraft 2>/dev/null || echo none)"
          if [ "$draft" = "false" ]; then
            echo "nueva=false" >> "$GITHUB_OUTPUT"
            echo "La versión v$v ya está publicada: no se hace nada."
            exit 0
          fi
          echo "nueva=true" >> "$GITHUB_OUTPUT"
          if [ "$draft" = "none" ]; then
            gh release create "v$v" --draft --target "$GITHUB_SHA" --title "CRM Mellow $v" --notes "En preparación."
          fi
          echo "Se publicará la versión v$v."

  instaladores:
    name: Instalador ${{ matrix.nombre }}
    needs: [calidad, version]
    # «version» solo corre en main: si se salta, los instaladores se generan igual.
    if: >-
      always() && needs.calidad.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      PUBLICAR: ${{ needs.version.outputs.nueva }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Windows
            os: windows-latest
          - nombre: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # En Windows se usa el mismo script de instalación que en tu ordenador, para
      # que quede probado en un Windows real en cada build.
      - name: Instalar dependencias (script de Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\instalar-windows.ps1 -SinPreguntas

      - name: Instalar dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          # bsdtar hace falta para generar el paquete pacman.
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          npm ci
          node scripts/descargar-ffmpeg.mjs
          npm test

      - name: Generar instalador de Windows
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Generar paquetes de Linux (pacman y AppImage)
        if: runner.os == 'Linux'
        run: npm run dist:linux

      - name: Verificar fuses de seguridad
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            node scripts/verificar-fuses.mjs release/win-unpacked/crm-mellow.exe
          else
            node scripts/verificar-fuses.mjs release/linux-unpacked/crm-mellow
          fi

      - name: Autoprueba de la app empaquetada (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath release\win-unpacked\crm-mellow.exe -ArgumentList '--autoprueba' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput autoprueba.txt
          Get-Content autoprueba.txt
          if ($p.ExitCode -ne 0) { throw "La autoprueba ha fallado (código $($p.ExitCode))" }

      - name: Probar el instalador (instalar, abrir, desinstalar)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $instalador = (Get-ChildItem release\*-instalador.exe | Select-Object -First 1).FullName
          powershell -ExecutionPolicy Bypass -File scripts\probar-instalador-windows.ps1 $instalador

      - name: Autoprueba de la app empaquetada (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a release/linux-unpacked/crm-mellow --autoprueba

      # Arch Linux real en un contenedor: el script de instalación desde cero, el paquete
      # pacman instalado como lo haría el usuario, la autoprueba, el AppImage y desinstalar.
      - name: Prueba en Arch Linux (contenedor)
        if: runner.os == 'Linux'
        run: |
          docker run --rm --cap-add SYS_ADMIN --security-opt seccomp=unconfined \
            -v "$PWD:/repo:ro" archlinux:latest bash -euxc '
              pacman -Syu --noconfirm --needed git sudo xorg-server-xvfb xorg-xauth
              useradd -m dev
              echo "dev ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/dev
              git config --global --add safe.directory "*"
              git clone -q /repo /home/dev/repo
              chown -R dev:dev /home/dev/repo
              su dev -c "cd /home/dev/repo && bash scripts/instalar-arch.sh --sin-preguntas"
              pacman -U --noconfirm /repo/release/*.pacman
              su dev -c "xvfb-run -a crm-mellow --autoprueba"
              cp /repo/release/*.AppImage /home/dev/crm.AppImage
              chown dev /home/dev/crm.AppImage
              chmod +x /home/dev/crm.AppImage
              su dev -c "APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a /home/dev/crm.AppImage --autoprueba > /dev/null 2>&1"
              echo "AppImage: autoprueba correcta"
              pacman -R --noconfirm crm-mellow
            '

      - name: Subir a la versión (Releases)
        if: env.PUBLICAR == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            gh release upload "v$VERSION" release/*.exe --clobber
          else
            gh release upload "v$VERSION" release/*.pacman release/*.AppImage --clobber
          fi

      # Copia en Actions, solo al lanzarlo a mano y un día: si el almacenamiento gratuito de
      # artefactos está lleno, no falla la ejecución (los instaladores ya están probados).
      - name: Guardar en Actions (Windows)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: CRM-Mellow-windows
          path: release/*.exe
          retention-days: 1
          compression-level: 0

      - name: Guardar en Actions (Linux)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: CRM-Mellow-linux
          path: |
            release/*.pacman
            release/*.AppImage
          retention-days: 1
          compression-level: 0

  # App de Android (D-101): el APK se compila aquí, se prueba en el emulador (autoprueba del
  # motor e interfaz cargada) y, con la clave de firma guardada como secreto, se publica.
  android:
    name: App de Android
    needs: [calidad, version]
    if: >-
      always() && needs.calidad.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      PUBLICAR: ${{ needs.version.outputs.nueva }}
      GRADLE_VERSION: 9.8.0
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # El emulador necesita varios GB libres; el runner trae herramientas que aquí no se usan.
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY/PyPy" || true
          df -h /

      - name: Herramientas de Android (SDK, NDK, CMake, Gradle y JDK 21)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null
          curl -sSLo "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE=$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin/gradle" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: npm ci

      # La clave de firma solo existe como secreto del repositorio (nunca en el código).
      # Sin ella, el APK se firma con una clave de prueba y no se publica.
      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/crm.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/crm.jks" >> "$GITHUB_ENV"
            echo "FIRMADO=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_B64: el APK no se publicará (README → App de Android)."
            echo "FIRMADO=false" >> "$GITHUB_ENV"
          fi

      - name: Compilar el APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/compilar-android.sh release

      - name: Permitir el emulador (KVM)
        run: |
          # Lo compilado ya no hace falta: solo queda probar el APK.
          rm -rf android/app/build/intermediates android/.nodejs-mobile android/app/.cxx ~/.gradle/caches
          df -h /
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar el APK en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/probar-android-emulador.sh release/CRM-Mellow-*-android-x86_64.apk

      - name: Subir a la versión (Releases)
        if: env.PUBLICAR == 'true' && env.FIRMADO == 'true'
        run: gh release upload "v$VERSION" release/*-android-arm64.apk --clobber

      - name: Guardar en Actions
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: CRM-Mellow-android
          path: release/*-android-arm64.apk
          retention-days: 1
          compression-level: 0

  publicar:
    name: Publicar versión
    needs: [version, instaladores, android]
    if: >-
      needs.version.outputs.nueva == 'true' && needs.instaladores.result == 'success' &&
      needs.android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Sumas de comprobación, notas y publicar
        run: |
          mkdir paquetes
          gh release download "v$VERSION" -D paquetes --pattern "*.exe" --pattern "*.pacman" --pattern "*.AppImage" --pattern "*.apk"
          ls -la paquetes
          (cd paquetes && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "v$VERSION" paquetes/SHA256SUMS.txt --clobber
          {
            if [ -f .github/novedades.md ]; then cat .github/novedades.md; echo; fi
            sed "s/{{VERSION}}/$VERSION/g" .github/notas-version.md
            # La app de Android solo aparece si se ha publicado su APK (hace falta la clave).
            if ls paquetes/*.apk > /dev/null 2>&1; then
              sed "s/{{VERSION}}/$VERSION/g" .github/notas-android.md
            fi
          } > notas.md
          gh release edit "v$VERSION" --notes-file notas.md --draft=false --latest
